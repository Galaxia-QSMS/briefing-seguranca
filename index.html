<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Briefing de Segurança | Galáxia Navegação</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #061b3a,
                #0b3768,
                #0d4d87
            );
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: block;
            width: auto;
            max-width: 230px;
            max-height: 100px;
            margin: 0 auto 25px auto;
            object-fit: contain;
        }

        h1 {
            color: #062d59;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
        }

        .section-title {
            color: #062d59;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 5px solid #0d72b9;
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #334155;
            margin-bottom: 7px;
        }

        .required {
            color: #d32f2f;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: #ffffff;
            color: #1e293b;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0d72b9;
            box-shadow: 0 0 0 3px rgba(13, 114, 185, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .button {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #07569b,
                #0d72b9
            );
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(7, 86, 155, 0.25);
        }

        .button:active {
            transform: translateY(0);
        }

        .info-box {
            margin-top: 22px;
            padding: 14px 16px;
            background: #f0f7fc;
            border-left: 4px solid #0d72b9;
            border-radius: 7px;
            color: #475569;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            border-color: #d32f2f !important;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                max-width: 190px;
                max-height: 85px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <img
                    src="./logo-galaxia.png"
                    class="logo"
                    alt="Galáxia Navegação"
                >

                <h1>Briefing de Segurança</h1>

                <p class="subtitle">
                    Antes de acessar a embarcação, preencha seus dados
                    e assista ao Briefing de Segurança correspondente.
                </p>

            </div>


            <form
                id="briefingForm"
                novalidate
            >

                <div class="section-title">
                    Identificação do visitante
                </div>


                <!-- NOME -->

                <div class="form-group">

                    <label for="nome">
                        Nome completo
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="form-group">

                    <label for="cpf">
                        CPF
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        inputmode="numeric"
                        required
                    >

                </div>


                <!-- EMPRESA -->

                <div class="form-group">

                    <label for="empresa">
                        Empresa
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        placeholder="Digite o nome da empresa"
                        required
                    >

                </div>


                <!-- MOTIVO -->

                <div class="form-group">

                    <label for="motivo">
                        Motivo da visita
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="motivo"
                        name="motivo"
                        placeholder="Ex.: Reunião, manutenção, serviço..."
                        required
                    >

                </div>


                <!-- DATA DA VISITA -->

                <div class="form-group">

                    <label for="dataVisita">
                        Data da visita
                        <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="dataVisita"
                        name="dataVisita"
                        required
                    >

                </div>


                <!-- EMBARCAÇÃO -->

                <div class="form-group">

                    <label for="embarcacao">
                        Embarcação a visitar
                        <span class="required">*</span>
                    </label>

                    <select
                        id="embarcacao"
                        name="embarcacao"
                        required
                    >

                        <option value="">
                            Selecione a embarcação
                        </option>

                        <option value="Atlas Z">
                            Atlas Z
                        </option>

                        <option value="Theseus Z">
                            Theseus Z
                        </option>

                        <option value="Apollo Z">
                            Apollo Z
                        </option>

                        <option value="Captain Nicholas Z">
                            Captain Nicholas Z
                        </option>

                        <option value="GNL 1015">
                            GNL 1015
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="button"
                >
                    CONTINUAR
                </button>


                <div class="info-box">

                    🔒 Seus dados serão utilizados para o registro
                    do Briefing de Segurança e controle de acesso
                    à embarcação.

                </div>

            </form>

        </div>

    </div>


    <script>

        // ================================
        // MÁSCARA DE CPF
        // ================================

        const cpfInput = document.getElementById("cpf");

        cpfInput.addEventListener("input", function () {

            let cpf = this.value.replace(/\D/g, "");

            if (cpf.length > 11) {
                cpf = cpf.substring(0, 11);
            }

            cpf = cpf.replace(
                /(\d{3})(\d)/,
                "$1.$2"
            );

            cpf = cpf.replace(
                /(\d{3})(\d)/,
                "$1.$2"
            );

            cpf = cpf.replace(
                /(\d{3})(\d{1,2})$/,
                "$1-$2"
            );

            this.value = cpf;

        });


        // ================================
        // VALIDAÇÃO DE CPF
        // ================================

        function validarCPF(cpf) {

            cpf = cpf
                .replace(/\D/g, "");

            if (cpf.length !== 11) {
                return false;
            }

            // CPFs com todos os números iguais
            if (/^(\d)\1{10}$/.test(cpf)) {
                return false;
            }

            let soma = 0;
            let resto;

            for (let i = 1; i <= 9; i++) {
                soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
            }

            resto = (soma * 10) % 11;

            if (resto === 10 || resto === 11) {
                resto = 0;
            }

            if (resto !== parseInt(cpf.substring(9, 10))) {
                return false;
            }

            soma = 0;

            for (let i = 1; i <= 10; i++) {
                soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
            }

            resto = (soma * 10) % 11;

            if (resto === 10 || resto === 11) {
                resto = 0;
            }

            if (resto !== parseInt(cpf.substring(10, 11))) {
                return false;
            }

            return true;

        }


        // ================================
        // FORMULÁRIO
        // ================================

        const form = document.getElementById("briefingForm");


        form.addEventListener("submit", function (event) {

            event.preventDefault();


            // Limpa erros anteriores

            const campos = form.querySelectorAll(
                "input, select"
            );

            campos.forEach(function (campo) {

                campo.classList.remove("error");

            });


            // ================================
            // VERIFICA CAMPOS OBRIGATÓRIOS
            // ================================

            for (const campo of campos) {

                if (!campo.value.trim()) {

                    campo.classList.add("error");

                    alert(
                        "Por favor, preencha todos os campos obrigatórios."
                    );

                    campo.focus();

                    return;

                }

            }


            // ================================
            // VALIDA CPF
            // ================================

            const cpf = document.getElementById("cpf").value;

            if (!validarCPF(cpf)) {

                cpfInput.classList.add("error");

                alert(
                    "Digite um CPF válido."
                );

                cpfInput.focus();

                return;

            }


            // ================================
            // CAPTURA DOS DADOS
            // ================================

            const dados = {

                nome:
                    document.getElementById("nome").value.trim(),

                cpf:
                    document.getElementById("cpf").value.trim(),

                empresa:
                    document.getElementById("empresa").value.trim(),

                motivo:
                    document.getElementById("motivo").value.trim(),

                dataVisita:
                    document.getElementById("dataVisita").value,

                embarcacao:
                    document.getElementById("embarcacao").value

            };


            console.log(
                "Dados do visitante:",
                dados
            );


            // ================================
            // TEMPORÁRIO
            // ================================

            alert(
                "Dados preenchidos corretamente!"
            );

        });

    </script>

</body>

</html>
