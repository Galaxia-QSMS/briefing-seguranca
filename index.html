<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Briefing de Segurança | Galáxia Navegação</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #06152f 0%,
                #0b2d5c 50%,
                #071b3a 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.30);
        }


        /* =========================
           CABEÇALHO
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: block;

            width: auto;
            max-width: 210px;
            max-height: 95px;

            object-fit: contain;

            margin: 0 auto 22px auto;
        }

        .header h1 {
            color: #0a2d5c;

            font-size: 27px;

            margin-bottom: 10px;
        }

        .header p {
            color: #667085;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================
           TÍTULO DA SEÇÃO
        ========================= */

        .section-title {
            color: #0a2d5c;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 20px;

            padding-bottom: 10px;

            border-bottom: 2px solid #edf1f5;
        }


        /* =========================
           CAMPOS
        ========================= */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #344054;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #d0d5dd;

            border-radius: 10px;

            background: #ffffff;

            color: #172033;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #1769aa;

            box-shadow:
                0 0 0 3px rgba(23, 105, 170, 0.12);
        }

        select {
            cursor: pointer;
        }


        /* =========================
           BOTÃO
        ========================= */

        .button {
            width: 100%;

            height: 50px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background: #0a2d5c;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .button:hover {
            background: #12477f;

            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }


        /* =========================
           AVISO
        ========================= */

        .info {
            margin-top: 22px;

            padding: 14px;

            background: #f4f7fa;

            border-radius: 10px;

            color: #667085;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }


        /* =========================
           ERRO
        ========================= */

        .error {
            display: none;

            margin-top: 5px;

            color: #c62828;

            font-size: 12px;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;

                border-radius: 16px;
            }

            .header h1 {
                font-size: 23px;
            }

            .logo {
                max-width: 180px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="card">


            <!-- =========================
                 CABEÇALHO
            ========================= -->

            <div class="header">


                <!-- LOGO -->

                <img
                    src="logo-galaxia.png"
                    class="logo"
                    alt="Galáxia Navegação"
                >


                <h1>
                    Briefing de Segurança
                </h1>


                <p>
                    Antes de acessar a embarcação,
                    preencha seus dados e assista ao
                    Briefing de Segurança correspondente.
                </p>


            </div>


            <!-- =========================
                 FORMULÁRIO
            ========================= -->

            <div class="section-title">
                Identificação do visitante
            </div>


            <form
                id="briefingForm"
                novalidate
            >


                <!-- NOME -->

                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="form-group">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        maxlength="14"
                        required
                    >

                    <div
                        class="error"
                        id="cpfError"
                    >
                        Informe um CPF válido.
                    </div>

                </div>


                <!-- EMPRESA -->

                <div class="form-group">

                    <label for="empresa">
                        Empresa
                    </label>

                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        placeholder="Digite o nome da empresa"
                        required
                    >

                </div>


                <!-- MOTIVO -->

                <div class="form-group">

                    <label for="motivo">
                        Motivo da visita
                    </label>

                    <input
                        type="text"
                        id="motivo"
                        name="motivo"
                        placeholder="Ex.: reunião, manutenção, inspeção..."
                        required
                    >

                </div>


                <!-- DATA -->

                <div class="form-group">

                    <label for="dataVisita">
                        Data da visita
                    </label>

                    <input
                        type="date"
                        id="dataVisita"
                        name="dataVisita"
                        required
                    >

                </div>


                <!-- EMBARCAÇÃO -->

                <div class="form-group">

                    <label for="embarcacao">
                        Embarcação a visitar
                    </label>

                    <select
                        id="embarcacao"
                        name="embarcacao"
                        required
                    >

                        <option value="">
                            Selecione a embarcação
                        </option>

                        <option value="Atlas Z">
                            Atlas Z
                        </option>

                        <option value="Theseus Z">
                            Theseus Z
                        </option>

                        <option value="Apollo Z">
                            Apollo Z
                        </option>

                        <option value="Captain Nicholas Z">
                            Captain Nicholas Z
                        </option>

                        <option value="GNL 1015">
                            GNL 1015
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="button"
                >
                    CONTINUAR
                </button>


            </form>


            <!-- =========================
                 AVISO
            ========================= -->

            <div class="info">

                🔒 Seus dados serão utilizados para o
                registro do Briefing de Segurança e
                controle de acesso à embarcação.

            </div>


        </div>


    </div>


    <script>

        /* ==========================================
           ELEMENTOS
        ========================================== */

        const form =
            document.getElementById(
                "briefingForm"
            );

        const cpfInput =
            document.getElementById(
                "cpf"
            );

        const cpfError =
            document.getElementById(
                "cpfError"
            );


        /* ==========================================
           MÁSCARA CPF
        ========================================== */

        cpfInput.addEventListener(
            "input",
            function () {

                let value =
                    this.value.replace(/\D/g, "");

                value =
                    value.substring(0, 11);


                if (value.length > 9) {

                    value =
                        value.replace(
                            /^(\d{3})(\d{3})(\d{3})(\d{1,2}).*/,
                            "$1.$2.$3-$4"
                        );

                }

                else if (value.length > 6) {

                    value =
                        value.replace(
                            /^(\d{3})(\d{3})(\d{1,3}).*/,
                            "$1.$2.$3"
                        );

                }

                else if (value.length > 3) {

                    value =
                        value.replace(
                            /^(\d{3})(\d{1,3}).*/,
                            "$1.$2"
                        );

                }


                this.value = value;

                cpfError.style.display = "none";

            }
        );


        /* ==========================================
           VALIDAÇÃO CPF
        ========================================== */

        function validarCPF(cpf) {

            cpf =
                cpf.replace(/\D/g, "");


            if (cpf.length !== 11) {
                return false;
            }


            if (/^(\d)\1+$/.test(cpf)) {
                return false;
            }


            let soma = 0;


            for (
                let i = 0;
                i < 9;
                i++
            ) {

                soma +=
                    parseInt(cpf.charAt(i)) *
                    (10 - i);

            }


            let resto =
                11 - (soma % 11);


            let digito1 =
                resto >= 10
                    ? 0
                    : resto;


            if (
                digito1 !==
                parseInt(cpf.charAt(9))
            ) {

                return false;

            }


            soma = 0;


            for (
                let i = 0;
                i < 10;
                i++
            ) {

                soma +=
                    parseInt(cpf.charAt(i)) *
                    (11 - i);

            }


            resto =
                11 - (soma % 11);


            let digito2 =
                resto >= 10
                    ? 0
                    : resto;


            return (
                digito2 ===
                parseInt(cpf.charAt(10))
            );

        }


        /* ==========================================
           VERIFICAÇÃO DOS CAMPOS
        ========================================== */

        function validarFormulario() {

            const campos =
                form.querySelectorAll(
                    "input[required], select[required]"
                );


            for (const campo of campos) {

                if (
                    campo.value.trim() === ""
                ) {

                    campo.focus();

                    campo.reportValidity();

                    return false;

                }

            }


            if (!validarCPF(cpfInput.value)) {

                cpfError.style.display =
                    "block";

                cpfInput.focus();

                return false;

            }


            return true;

        }


        /* ==========================================
           ENVIO
        ========================================== */

        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                if (!validarFormulario()) {

                    return;

                }


                const dados = {

                    nome:
                        document.getElementById(
                            "nome"
                        ).value.trim(),

                    cpf:
                        cpfInput.value,

                    empresa:
                        document.getElementById(
                            "empresa"
                        ).value.trim(),

                    motivo:
                        document.getElementById(
                            "motivo"
                        ).value.trim(),

                    dataVisita:
                        document.getElementById(
                            "dataVisita"
                        ).value,

                    embarcacao:
                        document.getElementById(
                            "embarcacao"
                        ).value

                };


                console.log(
                    "Dados do visitante:",
                    dados
                );


                /*
                    PRÓXIMA ETAPA:

                    Os dados serão enviados para a
                    etapa do vídeo correspondente
                    à embarcação selecionada.
                */


                alert(
                    "Dados preenchidos corretamente!"
                );

            }
        );

    </script>


</body>

</html>
